[package]
name = "desktoplol"
version = "0.0.1"
description = "Unofficial desktop corner widget for following live League of Legends pro games."
edition = "2021"
rust-version = "1.80"

[lib]
name = "desktoplol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
